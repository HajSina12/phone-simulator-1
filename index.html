<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0e17">
<title>Phone Simulator 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e17;--card:#141b2b;--card2:#1b2438;--line:#24304d;--line2:#2e3d61;--tx:#eaeff9;--tx2:#8fa0c2;--tx3:#5c6a8c;--acc:#4f8cff;--acc2:#9a5cff;--good:#22c55e;--warn:#f5a524;--bad:#ef4444;--grad:linear-gradient(135deg,#4f8cff,#9a5cff)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:'Vazirmatn',Tahoma,'Segoe UI',sans-serif;user-select:none;-webkit-user-select:none;touch-action:manipulation;overscroll-behavior-y:contain}
#app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:calc(86px + env(safe-area-inset-bottom))}
#hdr{position:sticky;top:0;z-index:40;background:rgba(10,14,23,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 12px 8px}
.hrow1{display:flex;align-items:center;gap:10px}
#hEmoji{font-size:30px}
#hName{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.hbtns{margin-inline-start:auto;display:flex;gap:8px}
.iconBtn{width:36px;height:36px;border-radius:11px;background:var(--card2);border:1px solid var(--line2);color:var(--tx2);font-size:15px;cursor:pointer;font-family:inherit}
.hrow2{display:flex;gap:8px;margin-top:8px}
.pill{flex:1;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:5px 8px;font-size:11px;color:var(--tx2);display:flex;align-items:center;gap:5px;justify-content:center}
.pill b{color:var(--tx);font-size:12.5px}
.chipS{background:var(--card2);border:1px solid var(--line2);border-radius:99px;padding:2px 9px;font-size:11px;color:var(--tx2);white-space:nowrap}
#ticker{padding:6px 14px;font-size:11.5px;color:var(--tx2);white-space:nowrap;overflow:hidden;border-bottom:1px solid var(--line);background:rgba(13,18,30,.6)}
#tickerTxt{display:inline-block;transition:opacity .35s}
.scr{display:none;padding:12px 12px 20px}
.scr.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.sec{margin-bottom:12px}
.sec h3{font-size:13px;color:var(--tx2);margin:0 0 8px;font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{display:flex;justify-content:space-between;align-items:center;background:var(--card2);padding:8px 12px;border-radius:12px;font-size:12px;color:var(--tx2);gap:8px}
.stat b{color:var(--tx);font-size:13px;white-space:nowrap}
.sub{font-size:12px;color:var(--tx2);line-height:1.8}
.center{text-align:center}
.foot{text-align:center;color:var(--tx3);font-size:11px;margin:18px 0 6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--grad);color:#fff;border:none;border-radius:14px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(79,140,255,.25)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;box-shadow:none;cursor:default}
.btn.ghost{background:var(--card2);color:var(--tx);border:1px solid var(--line2);box-shadow:none}
.btn.warn{background:linear-gradient(135deg,#f5a524,#ef6a24);box-shadow:0 6px 18px rgba(239,106,36,.25)}
.btn.small{padding:8px 12px;font-size:13px;border-radius:11px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;flex-direction:column;align-items:center;min-width:62px;padding:7px 12px;background:var(--card2);border:1px solid var(--line2);border-radius:12px;color:var(--tx);font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.chip small{font-size:10px;color:var(--tx2);font-weight:400}
.chip.on{background:var(--grad);border-color:transparent}
.chip.on small{color:rgba(255,255,255,.85)}
.chip.lock{opacity:.45}
.inp{width:100%;background:#0d1322;border:1px solid var(--line2);color:var(--tx);border-radius:12px;padding:11px 12px;font:inherit;font-size:16px}
.inp:focus{outline:none;border-color:var(--acc)}
input[type=range]{accent-color:var(--acc);width:100%}
.bar{height:8px;background:#0d1322;border-radius:99px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .3s}
.swRow{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;justify-content:center}
.swatch{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer;position:relative;padding:0}
.swatch.on{border-color:#fff;box-shadow:0 0 0 3px var(--acc)}
.swatch .tr{position:absolute;top:-6px;left:-6px;font-size:12px}
.swatch .lk{position:absolute;top:-6px;right:-6px;font-size:11px}
.partRow{margin-top:12px}
.dots span{width:9px;height:9px;border-radius:50%;background:#232d45;display:inline-block;margin-inline-start:3px}
.dots span.f{background:var(--grad)}
.bigE{font-size:38px}
.cName{font-size:18px;font-weight:800}
.heroVal{margin-top:12px;font-size:13px;color:var(--tx2)}
.heroVal b{color:var(--tx);font-size:15px}
.crown{margin-top:10px;text-align:center;background:linear-gradient(135deg,rgba(245,200,60,.15),rgba(245,165,36,.15));border:1px solid rgba(245,200,60,.4);color:#ffd75e;border-radius:12px;padding:8px;font-weight:800}
.needTo{margin-top:8px;font-size:12px;color:var(--tx2);text-align:center}
.needTo b{color:var(--warn)}
.prevPh{display:flex;align-items:center;justify-content:center;flex:0 0 150px}
.prevInfo{flex:1;min-width:0}
.pvName{font-weight:800;font-size:16px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pvRate{font-size:12px;color:var(--tx2);margin:4px 0 8px}
.pvRow{display:flex;justify-content:space-between;font-size:12.5px;color:var(--tx2);padding:3px 0;border-bottom:1px dashed var(--line)}
.pvRow b{color:var(--tx)}
.stars{position:relative;display:inline-block;font-size:13px;letter-spacing:2px;line-height:1}
.starsBg{color:#2c3650}
.starsIn{position:absolute;top:0;right:0;overflow:hidden;white-space:nowrap;color:#ffc93c}
.ph{position:relative;margin:0 auto;box-shadow:0 12px 32px rgba(0,0,0,.5),inset 0 0 0 3px rgba(0,0,0,.5);flex:0 0 auto}
.cam{position:absolute;top:9px;left:9px;display:flex;flex-wrap:wrap;gap:4px;padding:5px;background:rgba(0,0,0,.30);border-radius:11px;z-index:3}
.lens{width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#43536e,#05070c 62%);box-shadow:inset 0 0 2px rgba(255,255,255,.35),0 1px 2px rgba(0,0,0,.5);position:relative}
.lens::after{content:'';position:absolute;top:20%;left:20%;width:28%;height:28%;border-radius:50%;background:rgba(255,255,255,.4)}
.scr2{position:absolute;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center}
.oswall{position:absolute;inset:0}
.ostime{position:relative;color:#fff;font-weight:800;font-size:16px;text-shadow:0 1px 4px rgba(0,0,0,.4);z-index:2}
.osname{position:absolute;bottom:7px;width:100%;text-align:center;color:rgba(255,255,255,.75);font-size:8.5px;z-index:2}
.spk{position:absolute;top:4px;left:50%;transform:translateX(-50%);width:28%;height:3px;border-radius:99px;background:rgba(0,0,0,.55);z-index:2}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:42%;height:13px;background:#000;border-radius:0 0 10px 10px;z-index:3}
.punch{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:11px;height:11px;background:#000;border-radius:50%;z-index:3}
.punch.tiny{width:5px;height:5px;opacity:.45}
.gloss{position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,transparent 25%,rgba(255,255,255,.3) 42%,rgba(255,255,255,.05) 55%,transparent 70%);pointer-events:none;z-index:4}
.brush{position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(115deg,rgba(255,255,255,.06) 0 2px,transparent 2px 6px);pointer-events:none;z-index:4}
.weave{position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(45deg,rgba(0,0,0,.28) 0 5px,transparent 5px 10px),repeating-linear-gradient(-45deg,rgba(0,0,0,.28) 0 5px,transparent 5px 10px);pointer-events:none;z-index:4}
.dot2{width:18px;height:18px;border-radius:6px;display:inline-block;border:1px solid rgba(255,255,255,.25);flex:0 0 auto}
.hrow{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
summary{cursor:pointer;color:var(--tx2);font-size:12px}
.rrow{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:12px;background:var(--card2);margin-bottom:6px}
.rrow.me{outline:2px solid var(--acc)}
.rk{width:26px;text-align:center;font-weight:800}
.re{font-size:18px}
.rn{flex:1;font-size:13px;font-weight:700;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rn small{color:var(--acc)}
.rv{font-size:11.5px;color:var(--tx2);white-space:nowrap}
.achv{display:grid;grid-template-columns:1fr;gap:6px;margin-top:10px}
.achi{font-size:12px;padding:8px 10px;border-radius:10px;background:var(--card2);color:var(--tx3)}
.achi.on{color:var(--tx);outline:1px solid rgba(245,200,60,.4)}
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,560px);display:flex;background:rgba(13,18,30,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:50;gap:4px}
.navBtn{flex:1;background:none;border:none;color:var(--tx3);font:inherit;font-size:11px;font-weight:700;padding:6px 2px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.navBtn .ic{font-size:20px}
.navBtn.on{color:#fff;background:var(--card2)}
#toasts{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(94%,520px);z-index:60;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:rgba(20,27,43,.96);border:1px solid var(--line2);border-radius:13px;padding:10px 14px;font-size:13px;opacity:0;transform:translateY(8px);transition:.25s;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.in{opacity:1;transform:none}
.toast.warn{border-color:rgba(245,165,36,.5)}
.toast.gold{border-color:rgba(245,200,60,.6)}
#modalWrap{position:fixed;inset:0;background:rgba(4,7,14,.72);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:18px}
#modalWrap[hidden]{display:none!important}
#modalCard{background:var(--card);border:1px solid var(--line2);border-radius:20px;padding:20px;width:100%;max-width:420px;max-height:86vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.helpList{padding-inline-start:18px;line-height:2;font-size:13.5px;color:var(--tx2);text-align:right}
h2{margin:8px 0}
</style>
</head>
<body>
<div id="app">
 <header id="hdr">
  <div class="hrow1">
   <span id="hEmoji">📱</span>
   <div><div id="hName">شرکت من</div><span class="chipS" id="hRank">رتبه ۱۰ از ۱۰</span></div>
   <div class="hbtns">
    <button class="iconBtn" id="btnSupport">❤️</button>
    <button class="iconBtn" id="btnSound">🔊</button>
    <button class="iconBtn" id="btnHelp">؟</button>
   </div>
  </div>
  <div class="hrow2">

 </header>

  <section class="scr" id="scr-research"></section>
  <section class="scr" id="scr-rank"></section>
 </main>
 <nav id="nav">

 <div id="modalWrap" hidden><div id="modalCard"></div></div>
</div>

 const a=p(h1),b=p(h2);return '#'+a.map((v,i)=>Math.round(v+(b[i]-v)*t).toString(16).padStart(2,'0')).join('');}

/* ================= محاسبات هسته ================= */
function calcRating(d){let raw=0;const ts=[];
 for(const k in PARTS){raw+=PARTS[k].t[d.parts[k]-1].s;ts.push(d.parts[k]);}
 raw+=MATS[d.mat].p+SIZES[d.size].r+OSL[d.os].q;
 if(Math.max(...ts)-Math.min(...ts)<=1)raw+=4;
 return Math.max(1,Math.min(105,Math.round(raw/1.85)));}
function unitCost(d){let c=0;for(const k in PARTS)c+=PARTS[k].t[d.parts[k]-1].c;
 return Math.round(c*SIZES[d.size].cm+MATS[d.mat].c+OSL[d.os].l+8);}
function fairOf(cost,rating,size){return Math.round((cost*1.6+rating*6)*SIZES[size].fm);}
function capacity(){return 2*Math.pow(1.55,S.factory.cap);}
function effCostMult(){let m=1-.04*S.factory.eff;for(const f of S.effects)if(f.k==='cost')m*=f.v;return m;}
function decayOf(age){return Math.max(.05,1/(1+Math.pow(age/90,1.15)));}
function phoneDemand(p,now){now=now||Date.now();
 const age=(now-p.releasedAt)/1000,decay=decayOf(age);
 const r=p.price/p.fair;
 const pf=r<=1?1+.6*(1-r):Math.max(.05,1-1.1*(r-1));
 const repF=1+S.rep/100, fanF=Math.min(12,1+Math.sqrt(Math.max(0,S.fans))/40);
 const colF=p.color===S.trend?1.15:1;
 let d=.02*Math.pow(p.rating,1.4)*pf*repF*fanF*decay*colF*SIZES[p.size].dm;
 for(const f of S.effects)if(f.k==='demand')d*=f.v;
 if(S.support&&S.support.badge)d*=1.05;
 return d;}
function pVal(){return S.money+S.stats.revenue*.35+S.fans*15+S.rep*5000;}
function rank(){const v=pVal();let r=1;for(const rv of S.rivals)if(rv.v>v)r++;return r;}
function ranked(){const list=RIVALS.map((r,i)=>({n:r.n,e:r.e,v:S.rivals[i].v,me:false}));
 list.push({n:S.company.name||'شرکت من',e:S.company.emoji,v:pVal(),me:true});
 list.sort((a,b)=>b.v-a.v);return list;}
function calcFlow(){const now=Date.now(),cap=capacity();
 const act=S.phones.filter(p=>p.active),ds=act.map(p=>phoneDemand(p,now));
 const tot=ds.reduce((a,b)=>a+b,0);let ups=0,inc=0;
 act.forEach((p,i)=>{let r=ds[i];if(tot>cap)r*=cap/tot;
  const mg=p.price-p.unitCost*effCostMult();if(mg<=0)return;ups+=r;inc+=r*mg;});
 return{ups,inc};}
function capUpCost(){return Math.round(1200*Math.pow(2.1,S.factory.cap));}
function effUpCost(){return Math.round(2500*Math.pow(2.3,S.factory.eff));}
function labUpCost(){return Math.round(4000*Math.pow(2.6,S.factory.lab));}
function adCost(){return Math.round(800+S.fans*.6+S.stats.revenue*.00005);}

/* ================= شبیه‌سازی ================= */
function step(dt,now){const cap=capacity();
 const act=S.phones.filter(p=>p.active);if(!act.length)return;
 const ds=act.map(p=>phoneDemand(p,now));
 const tot=ds.reduce((a,b)=>a+b,0);
 act.forEach((p,i)=>{let u=ds[i]*dt;if(tot>cap)u*=cap/tot;
  const mg=p.price-p.unitCost*effCostMult();if(mg<=0||u<=0)return;
  S.money+=u*mg;S.stats.units+=u;S.stats.revenue+=u*mg;p.sold+=u;p.revenue+=u*p.price;
  S.fans+=u*.3*(p.rating/100);S.rep=Math.min(100,S.rep+u*.0004);});
 for(let i=0;i<act.length;i++){const p=act[i];
  const raw=1/(1+Math.pow(((now-p.releasedAt)/1000)/90,1.15));
  if(raw<.05&&p.active){p.active=false;toast('📴 «'+p.name+'» از رده خارج شد');}}}
function simulateAway(sec){sec=Math.min(sec,4*3600);if(sec<1)return{units:0,revenue:0,sec:0};
 const now=Date.now(),cap=capacity(),list=[];let totWant=0;
 S.phones.forEach(p=>{if(!p.active)return;
  const d0=phoneDemand(p,now),d1=phoneDemand(p,now+sec*1000);
  const avg=(d0+d1)/2*.4;if(avg>0){list.push({p,w:avg*sec});totWant+=avg*sec;}});
 const scale=totWant>cap*sec?cap*sec/totWant:1;let tu=0,tr=0;
 list.forEach(o=>{const u=o.w*scale,mg=o.p.price-o.p.unitCost;if(mg<=0||u<=0)return;
  const rev=u*mg;S.money+=rev;o.p.sold+=u;o.p.revenue+=u*o.p.price;
  S.fans+=u*.3*(o.p.rating/100);S.rep=Math.min(100,S.rep+u*.0004);tu+=u;tr+=rev;});
 S.stats.units+=tu;S.stats.revenue+=tr;
 S.phones.forEach(p=>{const raw=1/(1+Math.pow(((now-p.releasedAt)/1000)/90,1.15));
  if(p.active&&raw<.05)p.active=false;});
 return{units:tu,revenue:tr,sec};}
function rivalTick(now){if(!S.lastRivalAt)S.lastRivalAt=now;
 const m=Math.floor((now-S.lastRivalAt)/60000);if(m<=0)return;
 const loops=Math.min(m,240);
 for(let i=0;i<loops;i++)S.rivals.forEach((r,j)=>{r.v*=1+RIVALS[j].g*(.5+Math.random());});
 if(m>240){const rest=m-240;S.rivals.forEach((r,j)=>{r.v*=Math.pow(1+RIVALS[j].g*.75,rest);});}
 S.lastRivalAt+=m*60000;if(S.lastRivalAt>now)S.lastRivalAt=now;}
function addFx(k,v,dur){S.effects.push({k,v,until:Date.now()+dur*1000});}

function tick(){const now=Date.now();let dt=(now-lastTick)/1000;lastTick=now;
 if(dt<0)dt=0;if(dt>3600)dt=3600;
 if(dt>30){const res=simulateAway(dt);
  if(res&&res.units>=1)toast('💤 غیبت '+fmtT(res.sec)+': '+fmt(res.units)+' فروش و '+fmt(res.revenue)+' دلار');}
 else if(dt>0)step(dt,now);
 if(S.rActive&&now>=S.rActive.doneAt){const c=S.rActive.cat;S.research[c]++;S.rActive=null;
  toast('🔬 تحقیق کامل شد: '+RCATS[c]+' سطح '+fa(S.research[c]),'gold');
  if(cur==='research')renderResearch();if(cur==='build')renderBuild();}
 if(now-S.trendAt>150000){S.trend=(S.trend+1)%TREND_N;S.trendAt=now;
  toast('🎨 رنگ ترند جدید: '+COLORS[S.trend].n);if(cur==='build')renderBuild();}
 if(S.effects.length)S.effects=S.effects.filter(f=>f.until>now);
 if(now>=S.nextEventAt){fireEvent();S.nextEventAt=now+100000+Math.random()*120000;}
 rivalTick(now);msTick();
 if(!S.won&&rank()===1&&S.stats.phones>=1){S.won=true;winModal();}
 updateHeader();
 if(now-lastUI>500){lastUI=now;updateVisible();}
 if(now-lastSave>4000){lastSave=now;save();}}

 +'<p class="sub" style="margin:0 0 14px">کمپانی گوشی خودت رو بساز؛ از یه گاراژ کوچیک تا بزرگ‌ترین کمپانی جهان! 👑</p>'
 +'<input id="obName" class="inp" placeholder="اسم کمپانی‌ات رو بنویس..." maxlength="24">'
 +'<div class="chips" style="margin-top:12px;justify-content:center">'+em.map(e=>'<button class="chip'+(e===obEmoji?' on':'')+'" data-mact="em" data-e="'+e+'" style="font-size:20px;min-width:44px">'+e+'</button>').join('')+'</div>'
 +'<button class="btn" style="width:100%;margin-top:16px" data-mact="obStart">🚀 شروع کار</button></div>',false);}
MCB.obStart=function(){const inp=$('obName');
 const nm=(inp&&inp.value.trim())||'موبایل من';
 S.company.name=nm;S.company.emoji=obEmoji;S.tut=true;save();
 toast('سلام «'+nm+'»! اول از تب 📱 یه گوشی بساز 🚀','gold');
 renderShell();show('home');};
function offlineModal(res){showModal('<div class="center"><div style="font-size:40px">💤</div>'
 +'<h2>گزارش غیبت</h2><p class="sub">موقع نبودنت ('+fmtT(res.sec)+') کارخانه‌ات همچنان کار کرد (با ۴۰٪ بازده):</p>'
 +'<div class="grid2" style="margin-top:12px">'
 +'<div class="stat"><span>فروش</span><b>'+fmt(res.units)+'</b></div>'
 +'<div class="stat"><span>درآمد</span><b style="color:var(--good)">'+fmt(res.revenue)+'$</b></div></div>'
 +'<button class="btn" style="width:100%;margin-top:16px" data-mact="close">ادامه 🎮</button></div>');}
function winModal(){showModal('<div class="center"><div style="font-size:52px">👑</div>'
 +'<h2>تبریک می‌گیم!</h2><p><b>'+esc(S.company.name)+'</b> حالا بزرگ‌ترین کمپانی گوشی جهانه!</p>'
 +'<p class="sub">این تازه شروع ماجراست… رکوردهاتو حفظ کن و امپراتوری‌ت رو گسترش بده.</p>'
 +'<button class="btn" style="width:100%;margin-top:16px" data-mact="close">ادامه سلطنت 👑</button></div>');}
function showHelp(){showModal('<h2>📖 راهنمای بازی</h2><ol class="helpList">'
 +'<li>📱 تو تب «ساخت» مدل جدیدت رو طراحی کن: سایز، بدنه، رنگ، قطعات و سیستم‌عامل.</li>'
 +'<li>💵 قیمت بذار و عرضه کن. هرچه امتیاز بالاتر و قیمت منصفانه‌تر، فروش بیشتر!</li>'
 +'<li>🏭 با پول فروش، کارخانه و آزمایشگاه رو تو تب «خانه» ارتقا بده.</li>'
 +'<li>🔬 تو تب «تحقیق» قطعات سطح بالاتر رو باز کن تا گوشی‌های خفن‌تر بسازی.</li>'
 +'<li>⭐ فروش بیشتر = طرفدار و شهرت بیشتر = مشتری بیشتر.</li>'
 +'<li>🎨 حواسشت به «رنگ ترند» باشه؛ ۱۵٪ تقاضای بیشتر می‌ده.</li>'
 +'<li>❤️ با تماشای ویدیوی حمایتی هم سازنده رو حمایت کن هم جایزه بگیر!</li>'
 +'<li>💤 موقع نبودنت هم کارخانه با ۴۰٪ بازده کار می‌کنه.</li>'
 +'<li>🏆 هدف نهایی: رتبه ۱ جهان و تکمیل همه دستاوردها!</li>'
 +'</ol><button class="btn" style="width:100%;margin-top:14px" data-mact="close">فهمیدم!</button>');}
function confirmReset(){showModal('<div class="center"><div style="font-size:38px">♻️</div>'
 +'<h2>شروع دوباره؟</h2><p class="sub">همه پیشرفتت (پول، گوشی‌ها، تحقیقات) برای همیشه پاک می‌شه!</p>'
 +'<div class="row" style="margin-top:16px;gap:8px">'
 +'<button class="btn ghost" style="flex:1" data-mact="close">بی‌خیال</button>'
 +'<button class="btn warn" style="flex:1" data-mact="resetYes">پاک کن!</button></div></div>');}
MCB.resetYes=function(){try{localStorage.removeItem(KEY);}catch(e){}
 location.reload();};

/* ================= رویدادها و ناوبری ================= */
function onMainClick(e){const b=e.target.closest('[data-act]');if(!b)return;
 click();buzz();const a=b.dataset.act;
 if(a==='size'){draft.size=+b.dataset.i;renderBuild();}
 else if(a==='mat'){const i=+b.dataset.i;
  if(S.research.mat<i+1)toast('🔒 اول ماده «'+MATS[i].n+'» رو تو تب تحقیق باز کن','warn');
  else{draft.mat=i;renderBuild();}}
 else if(a==='color'){const i=+b.dataset.i;
  if(i===8&&!S.support.badge){toast('🔒 رنگ رویال با ۳ بار تماشای ویدیوی حمایتی باز می‌شه (دکمه ❤️ بالای صفحه)','warn');return;}
  draft.color=i;renderBuild();}
 else if(a==='part'){const cat=b.dataset.cat,t=+b.dataset.t;
  if(S.research[cat]<t)toast('🔒 این قطعه قفل شده — تحقیق «'+RCATS[cat]+'» سطح '+fa(t),'warn');
  else{draft.parts[cat]=t;renderBuild();}}
 else if(a==='os'){const i=+b.dataset.i;
  if(S.research.os<i+1)toast('🔒 این سیستم‌عامل قفل است','warn');
  else{draft.os=i;renderBuild();}}
 else if(a==='dice'){draft.name=randName();renderBuild();}
 else if(a==='preset'){const{c,r,f}=draftCalc();const k=b.dataset.k;
  let p=k==='eco'?Math.round(c*1.25):k==='fair'?f:Math.round(f*1.5);
  const mx=Math.ceil(c*3.2);draft.price=Math.min(mx,Math.max(Math.ceil(c*1.05),p));
  const sl=$('priceRange');if(sl)sl.value=draft.price;updateBuildNumbers();}
 else if(a==='release')doRelease();
 else if(a==='stop'){const p=S.phones.find(x=>x.id===+b.dataset.id);
  if(p&&p.active){p.active=false;toast('⏹ تولید «'+p.name+'» متوقف شد');renderSales();}}
 else if(a==='research')startResearch(b.dataset.cat);
 else if(a==='upg')doUpgrade(b.dataset.k);
 else if(a==='ad')runAd();
 else if(a==='help')showHelp();
 else if(a==='support')openSupport();
 else if(a==='reset')confirmReset();
 else if(a==='goto')show(b.dataset.tab);}
function onMainInput(e){const t=e.target;
 if(t.id==='phName'){draft.name=t.value.slice(0,24);
  set('pvName',esc(draft.name)||'— بی‌نام —');}
 else if(t.id==='priceRange'){draft.price=+t.value;updateBuildNumbers();}}
function doUpgrade(k){const max={cap:15,eff:10,lab:5}[k];
 if(S.factory[k]>=max){toast('به حداکثر سطح رسیدی!','warn');return;}
 const cost={cap:capUpCost(),eff:effUpCost(),lab:labUpCost()}[k];
 if(S.money<cost){toast('پول کافی نداری!','warn');return;}
 S.money-=cost;S.factory[k]++;
 toast('✅ '+({cap:'🏭 ظرفیت کارخانه',eff:'🦾 بهره‌وری مونتاژ',lab:'🧪 آزمایشگاه'})[k]+' ارتقا یافت!','gold');
 renderHome();}
function runAd(){const c=adCost();if(S.money<c){toast('پول کافی نداری!','warn');return;}
 S.money-=c;S.fans+=Math.max(250,Math.round(c*.4));
 S.rep=Math.min(100,S.rep+2);addFx('demand',1.5,90);
 toast('📣 کمپین تبلیغاتی اجرا شد! تقاضا ×۱.۵ (۹۰ ثانیه)','gold');renderHome();}

function show(tab){cur=tab;
 ['home','build','sales','research','rank'].forEach(t=>{
  $('scr-'+t).classList.toggle('on',t===tab);
  const nb=document.querySelector('.navBtn[data-tab="'+t+'"]');
  if(nb)nb.classList.toggle('on',t===tab);});
 if(tab==='build'&&!draft)draft=newDraft();
 renderScreen();window.scrollTo(0,0);}
function renderScreen(){
 if(cur==='home')renderHome();else if(cur==='build')renderBuild();
 else if(cur==='sales')renderSales();else if(cur==='research')renderResearch();
 else renderRank();}
function updateVisible(){
 if(cur==='sales')renderSales();
 else if(cur==='research')renderResearch();
 else if(cur==='rank')renderRank();
 else if(cur==='home')updateHomeLive();
 else if(cur==='build')updateBuildNumbers();}
function updateHeader(){set('hMoney',fmt(S.money));set('hFans',fmt(S.fans));
 set('hRep',fa(Math.floor(S.rep)));set('hRank','رتبه '+fa(rank())+' از ۱۰');}
function tickTicker(){const items=TIPS.slice();
 items.push('🎨 رنگ ترند فعلی: '+COLORS[S.trend].n+' — گوشی همرنگ +۱۵٪ تقاضا');
 const act=S.phones.filter(p=>p.active).sort((a,b)=>b.sold-a.sold)[0];
 if(act)items.push('🔥 پرفروش فعلی: «'+act.name+'» با '+fmt(act.sold)+' فروش');
 if(S.rActive)items.push('🔬 تحقیق در جریان: '+RCATS[S.rActive.cat]);
 const t=$('tickerTxt');if(!t)return;t.style.opacity=0;
 setTimeout(()=>{t.textContent=items[tIdx%items.length];tIdx++;t.style.opacity=1;},350);}

/* ================= راه‌اندازی ================= */
function initShell(){if(shellReady)return;shellReady=true;
 $('btnSupport').onclick=()=>{click();openSupport();};
 $('btnSound').onclick=()=>{S.sound=!S.sound;$('btnSound').textContent=S.sound?'🔊':'🔇';click();};
 $('btnHelp').onclick=()=>{click();showHelp();};
 document.querySelectorAll('.navBtn').forEach(b=>{b.onclick=()=>{click();show(b.dataset.tab);};});
 $('main').addEventListener('click',onMainClick);
 $('main').addEventListener('input',onMainInput);
 $('modalWrap').addEventListener('click',e=>{
  if(e.target.id==='modalWrap'&&$('modalWrap').dataset.d!=='0')closeModal();});
 $('modalCard').addEventListener('click',e=>{const b=e.target.closest('[data-mact]');if(!b)return;
  const a=b.dataset.mact;
  if(a==='em'){obEmoji=b.dataset.e;click();
   document.querySelectorAll('#modalCard .chip[data-mact="em"]').forEach(c=>c.classList.toggle('on',c.dataset.e===obEmoji));return;}
  click();
  if(a==='close'){closeModal();return;}
  if(a==='claim'){closeModal();claimAd();return;}
  const f=MCB[a];if(f){delete MCB[a];closeModal();f();}});
 document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
 window.addEventListener('pagehide',save);}
function renderShell(){$('hEmoji').textContent=S.company.emoji;
 $('hName').textContent=S.company.name||'شرکت من';
 $('btnSound').textContent=S.sound?'🔊':'🔇';initShell();}
function init(){S=load();let off=null;
 if(!S)S=freshState();
 else if(Date.now()-S.lastSeen>90000)off=simulateAway((Date.now()-S.lastSeen)/1000);
 draft=newDraft();
 renderShell();updateHeader();tickTicker();
 if(!S.company.name){showOnboarding();show('home');}
 else{if(off&&(off.units>=1||off.revenue>=1))offlineModal(off);show('home');}
 lastTick=Date.now();
 setInterval(tick,250);
 setInterval(tickTicker,7000);}
document.addEventListener('DOMContentLoaded',init);
</script>

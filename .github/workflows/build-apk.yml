name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Prepare project
      run: |
        mkdir -p www
        cp index.html www/index.html
        echo '{"name":"phone-simulator","version":"1.0.0","private":true}' > package.json
        echo '{"appId":"com.sina.phonesim1","appName":"Phone Simulator 1","webDir":"www"}' > capacitor.config.json

    - name: Install Capacitor
      run: npm install @capacitor/core @capacitor/cli @capacitor/android

    - name: Add Android platform
      run: npx cap add android

    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Phone-Simulator-1-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
